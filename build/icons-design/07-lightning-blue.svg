<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 深蓝石板背景（沿用方案 1） -->
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- 终端窗口边框渐变（方案 1 同款） -->
    <linearGradient id="term7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <!-- 闪电填充渐变 -->
    <linearGradient id="bolt7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <!-- 发光滤镜 -->
    <filter id="glow7" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角深蓝背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg7)"/>

  <!-- 终端窗口 -->
  <g>
    <!-- 主窗体（圆角矩形） -->
    <rect x="68" y="120" width="376" height="280" rx="22"
          fill="none" stroke="url(#term7)" stroke-width="10"/>
    <!-- 顶部标题栏 -->
    <path d="M 68 142 Q 68 120 90 120 L 422 120 Q 444 120 444 142 L 444 168 L 68 168 Z"
          fill="url(#term7)" opacity="0.85"/>
    <!-- 三个窗口控制点 -->
    <circle cx="98"  cy="144" r="8" fill="#1e293b"/>
    <circle cx="124" cy="144" r="8" fill="#1e293b"/>
    <circle cx="150" cy="144" r="8" fill="#1e293b"/>
  </g>

  <!-- 闪电（主体元素，发光） -->
  <g filter="url(#glow7)">
    <path d="M 296 188
             L 188 290
             L 250 290
             L 216 372
             L 332 250
             L 270 250
             L 320 188 Z"
          fill="url(#bolt7)"
          stroke="#bae6fd" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
