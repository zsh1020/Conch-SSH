<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hex1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg1)"/>

  <!-- 六边形外框 -->
  <polygon points="256,72 432,168 432,344 256,440 80,344 80,168"
           fill="none" stroke="url(#hex1)" stroke-width="14" stroke-linejoin="round"/>

  <!-- 终端提示符 + 输入的 zsh + 光标 -->
  <g filter="url(#glow1)">
    <!-- > 提示符 -->
    <polyline points="118,200 174,256 118,312"
              fill="none" stroke="#22d3ee" stroke-width="22"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- "zsh" 已输入文字（等宽字体） -->
    <text x="200" y="294"
          font-family="'Cascadia Code','JetBrains Mono','Consolas',monospace"
          font-size="116" font-weight="700" fill="#22d3ee"
          letter-spacing="-2">zsh</text>

    <!-- _ 光标块（紧跟 zsh 之后） -->
    <rect x="385" y="297" width="40" height="16" rx="2" fill="#22d3ee"/>
  </g>
</svg>
