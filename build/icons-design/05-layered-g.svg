<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="bg5-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg5)"/>

  <!-- 暗色阴影背板（深度感） -->
  <rect x="80" y="120" width="352" height="272" rx="48" fill="url(#bg5-deep)" opacity="0.35"/>

  <!-- 大写字母 G（几何粗体） -->
  <g fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- 主体弧 -->
    <path d="M 350 196
             A 90 90 0 1 0 350 316
             L 350 270
             L 290 270"/>
  </g>

  <!-- 终端光标 _ -->
  <rect x="180" y="358" width="152" height="22" rx="4" fill="#fff"/>

  <!-- 角标点（提示符意味） -->
  <g fill="#fef3c7">
    <circle cx="138" cy="158" r="10"/>
    <circle cx="170" cy="158" r="10"/>
    <circle cx="202" cy="158" r="10"/>
  </g>
</svg>
