<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="globe4" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg4)"/>

  <!-- 地球主体 -->
  <circle cx="256" cy="256" r="160" fill="url(#globe4)" stroke="#7dd3fc" stroke-width="4"/>

  <!-- 经度线 -->
  <g fill="none" stroke="#bae6fd" stroke-width="2.5" opacity="0.7">
    <ellipse cx="256" cy="256" rx="60"  ry="160"/>
    <ellipse cx="256" cy="256" rx="120" ry="160"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
  </g>

  <!-- 纬度线 -->
  <g fill="none" stroke="#bae6fd" stroke-width="2.5" opacity="0.7">
    <line  x1="96"  y1="256" x2="416" y2="256"/>
    <ellipse cx="256" cy="200" rx="148" ry="14"/>
    <ellipse cx="256" cy="312" rx="148" ry="14"/>
  </g>

  <!-- 连接节点（亮点） -->
  <g>
    <circle cx="160" cy="200" r="12" fill="#fbbf24"/>
    <circle cx="160" cy="200" r="20" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>

    <circle cx="356" cy="312" r="12" fill="#22d3ee"/>
    <circle cx="356" cy="312" r="20" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>

    <!-- 弧形连接线 -->
    <path d="M 160 200 Q 256 100 356 312"
          fill="none" stroke="#22d3ee" stroke-width="4"
          stroke-dasharray="8 6" stroke-linecap="round"/>
  </g>

  <!-- 底部 SSH 标签 -->
  <text x="256" y="478" font-family="'Segoe UI','SF Pro',sans-serif" font-size="34"
        font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="6">SSH</text>
</svg>
