<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0a24"/>
    </linearGradient>
    <linearGradient id="shield6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="shieldInner6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="96" fill="url(#bg6)"/>

  <!-- 盾牌外形 -->
  <path d="M 256 64
           L 432 120
           L 432 264
           Q 432 384 256 448
           Q 80 384 80 264
           L 80 120 Z"
        fill="url(#shield6)" stroke="#fef9c3" stroke-width="6"/>

  <!-- 盾牌内层（深色凹陷） -->
  <path d="M 256 100
           L 396 144
           L 396 264
           Q 396 364 256 412
           Q 116 364 116 264
           L 116 144 Z"
        fill="url(#shieldInner6)"/>

  <!-- 提示符 >_ -->
  <g fill="none" stroke="#fde047" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- > -->
    <polyline points="200,210 256,266 200,322"/>
    <!-- _ 光标 -->
    <line x1="278" y1="332" x2="350" y2="332"/>
  </g>

  <!-- 盾顶钥匙孔（小装饰） -->
  <circle cx="256" cy="160" r="14" fill="#fde047"/>
  <rect x="248" y="170" width="16" height="22" fill="#fde047"/>
</svg>
